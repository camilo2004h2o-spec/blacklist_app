name: Unit tests

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: blacklist_app

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run unit tests
        env:
          DATABASE_URL: sqlite:///:memory:
          BEARER_TOKEN: ci-test-token
        run: >
          poetry run pytest tests/unit -v
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: blacklist_app/coverage.xml
